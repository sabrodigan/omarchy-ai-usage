name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch a new `usage` release breaking the widget

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Manifest is valid JSON with the expected id
        run: python3 -c "import json; m = json.load(open('manifest.json')); assert m['id'] == 'sabrodigan.ai-usage', m['id']"

      - name: Collector compiles
        run: python3 -m py_compile bin/usage-run bin/dashboard

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      # End-to-end: run the collector against the latest published `usage` binary.
      # The usage repo also runs this contract test against every commit it builds,
      # so if its releases aren't readable from here, warn instead of failing.
      - name: Download latest usage release
        id: usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo sabrodigan/ai-usage-command \
               --pattern usage-linux-amd64 --pattern SHA256SUMS --dir "$RUNNER_TEMP/usage"; then
            echo "::warning::usage releases are not readable from this repo; contract test skipped"
            exit 0
          fi
          cd "$RUNNER_TEMP/usage"
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x usage-linux-amd64
          echo "bin=$RUNNER_TEMP/usage/usage-linux-amd64" >> "$GITHUB_OUTPUT"

      - name: Contract test against usage release
        if: steps.usage.outputs.bin != ''
        run: USAGE_BIN="${{ steps.usage.outputs.bin }}" python3 -m unittest tests.test_usage.UsageLocalContractTest -v
